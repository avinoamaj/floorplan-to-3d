<style>

  #view{position:fixed;inset:0} #view canvas{display:block}

  .panel{position:fixed;top:12px;right:12px;width:290px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;box-shadow:0 4px 18px rgba(0,0,0,.08);z-index:3}

  input[type=number]{width:72px;font:inherit;padding:3px 5px;border:1px solid #cfcac1;border-radius:6px;direction:ltr;text-align:right}
  .note{font-size:12px;color:var(--muted);line-height:1.45} .def{color:#e07000}
  #mlist{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px} #mlist li{padding:3px 0;border-bottom:1px dashed var(--line)}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(27,27,27,.85);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;z-index:3;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  .dim{font:500 11.5px Arial,Helvetica,sans-serif;color:#111;background:rgba(255,255,255,.88);padding:1px 4px;border-radius:3px;white-space:nowrap}
  .room{font:700 11.5px Arial,Helvetica,sans-serif;color:#222;text-align:center;line-height:1.3;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}
  .room span{font-weight:400;font-size:10.5px;color:#444}
  .mlab{font:700 12.5px Arial,sans-serif;color:#fff;background:var(--meas);padding:2px 6px;border-radius:4px;white-space:nowrap}
  #pad{position:fixed;left:14px;bottom:14px;display:none;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:6px;z-index:3;direction:ltr}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const R = __DATA__;      // resolved, approved model (cm). Plan x → world x, plan y → world z, height → world y.
const LANG = R.meta.lang === 'en' ? 'en' : 'he';
const T = {
 he:{ttl:'מודל תלת-מימדי',orbit:'סיבוב חופשי',top:'מלמעלה',walk:'הליכה',view:'תצוגה',ceiling:'תקרה',dims:'קווי מידה',rooms:'שמות חדרים',furniture:'ריהוט',leaves:'כנפי דלתות',
  measure:'סרגל מדידה',mBtn:'📏 מדידה',clear:'נקה',snap:'הצמדה לפינות קירות ופתחים',heights:'גבהים (ס"מ)',hCeil:'גובה תקרה',hDoor:'גובה דלתות',hSill:'אדן חלון',hHead:'משקוף חלון',
  hNoteDef:'בכתום: ברירת מחדל, לא מהתוכנית. שינוי מעדכן את המודל מיד.',hNoteOk:'שינוי מעדכן את המודל מיד.',sources:'מקור הנתונים',cm:'ס"מ',horiz:'אופקי',vert:'אנכי',
  hintOrbit:'גרירה: סיבוב · גלגלת: זום · קליק ימני: הזזה',hintTop:'גרירה: הזזה · גלגלת: זום',hintWalk:'W/S או ▲▼: קדימה/אחורה · A/D: הצידה · ←/→: סיבוב · גרירה: מבט · Shift: מהר',
  src:(r,t)=>`מיקום הקירות: מהמידות הכתובות (${r}), כפי שאושר בשלב 1. עובי קירות ${t}, פתחים, אלמנטים קבועים וריהוט: כפי שאושרו בשלב 1 (הערכות לפי קנה מידה). גובהי ריהוט: מידות סטנדרטיות.`,
  ref:{centerline:'קו מרכז קיר',interior:'פנים הקיר',exterior:'חוץ הקיר'}},
 en:{ttl:'3D model',orbit:'Orbit',top:'Top',walk:'Walk',view:'View',ceiling:'Ceiling',dims:'Dimensions',rooms:'Room names',furniture:'Furniture',leaves:'Door leaves',
  measure:'Measuring tool',mBtn:'📏 Measure',clear:'Clear',snap:'Snap to wall and opening corners',heights:'Heights (cm)',hCeil:'Ceiling',hDoor:'Door head',hSill:'Window sill',hHead:'Window head',
  hNoteDef:'Orange: default value, not from the plan. Changes update the model live.',hNoteOk:'Changes update the model live.',sources:'Data sources',cm:'cm',horiz:'horiz.',vert:'vert.',
  hintOrbit:'Drag: rotate · Wheel: zoom · Right-drag: pan',hintTop:'Drag: pan · Wheel: zoom',hintWalk:'W/S or ▲▼: move · A/D: strafe · ←/→: turn · Drag: look · Shift: fast',
  src:(r,t)=>`Wall positions: written dimensions (${r}) as approved in stage 1. Wall thickness ${t}, openings, fixed elements and furniture: as approved in stage 1 (scale estimates). Furniture heights: standard sizes.`,
  ref:{centerline:'wall centreline',interior:'inside face',exterior:'outside face'}}
}[LANG];
document.documentElement.lang=LANG; document.documentElement.dir=LANG==='he'?'rtl':'ltr';
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[e.dataset.t]);
document.getElementById('ttl').textContent=T.ttl;
for(const m of ['orbit','top','walk']) document.querySelector(`[data-m=${m}]`).textContent=T[m];
document.getElementById('bMeasure').textContent=T.mBtn; document.getElementById('bClear').textContent=T.clear;
const thTxt=[...new Set(R.walls.map(w=>w.t))].join('/')+' '+T.cm;
const iso=t=>LANG==='he'?String(t).replace(/[0-9A-Za-z(][0-9A-Za-z'"\s.,×xX*\-−–→←?:\/+=%()·|]*[0-9A-Za-z'"?)%]|[0-9A-Za-z]/g,m=>'\u2066'+m+'\u2069'):t;
document.getElementById('srcNote').textContent=T.src(T.ref[R.meta.dim_reference]||R.meta.dim_reference, thTxt);

// ---------------------------------------------------------------- geometry helpers (plan cm)
const W={}; for(const w of R.walls){const u=[(w.b[0]-w.a[0])/w.len,(w.b[1]-w.a[1])/w.len];w.u=u;w.n=[-u[1],u[0]];w.yaw=-Math.atan2(u[1],u[0]);W[w.id]=w;}
const at=(w,p,o)=>[w.a[0]+w.u[0]*p+w.n[0]*o, w.a[1]+w.u[1]*p+w.n[1]*o];
let xs=[],ys=[]; for(const w of R.walls){xs.push(w.a[0],w.b[0]);ys.push(w.a[1],w.b[1]);}
const BB={x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)}; BB.cx=(BB.x0+BB.x1)/2; BB.cy=(BB.y0+BB.y1)/2; BB.w=BB.x1-BB.x0; BB.h=BB.y1-BB.y0;
const maxT=Math.max(...R.walls.map(w=>w.t));

// ---------------------------------------------------------------- renderer / cameras
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; view.appendChild(renderer.domElement);
const labelR=new CSS2DRenderer({element:document.getElementById('labels')});
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe9e6e0);
const span=Math.max(BB.w,BB.h);
const persp=new THREE.PerspectiveCamera(50,1,2,50000); persp.position.set(BB.cx+span*.75,span*1.1,BB.cy+span*.95);
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,1,50000); ortho.up.set(0,0,-1); ortho.position.set(BB.cx,5000,BB.cy); ortho.lookAt(BB.cx,0,BB.cy);
const walkCam=new THREE.PerspectiveCamera(70,1,2,50000);
let camera=persp;
const orbit=new OrbitControls(persp,renderer.domElement); orbit.target.set(BB.cx,0,BB.cy); orbit.maxPolarAngle=Math.PI*.495; orbit.enableDamping=true; orbit.update();
const topCtl=new OrbitControls(ortho,renderer.domElement); topCtl.target.set(BB.cx,0,BB.cy); topCtl.enableRotate=false; topCtl.screenSpacePanning=true;
topCtl.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN}; topCtl.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_PAN}; topCtl.enabled=false; topCtl.update();
scene.add(new THREE.HemisphereLight(0xffffff,0xb9b2a6,1.25));
const sun=new THREE.DirectionalLight(0xffffff,1.35); sun.position.set(BB.cx-span*.6,1800,BB.cy+span); scene.add(sun);
const fillL=new THREE.DirectionalLight(0xfff3e4,.45); fillL.position.set(BB.cx+span,900,BB.cy-span); scene.add(fillL);

// ---------------------------------------------------------------- materials
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;}
const woodTex=canvasTex(256,256,(g,w,h)=>{for(let i=0;i<8;i++){const y=i*32;g.fillStyle=['#c49a6c','#cba479','#c1966a','#cea87e'][i%4];g.fillRect(0,y,w,31);g.fillStyle='rgba(90,60,30,.35)';g.fillRect(0,y+31,w,1);g.fillRect((i*97)%w,y,1,31);}});
const tileTex=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#d9dbd8';g.fillRect(0,0,w,h);g.strokeStyle='#b9bcb8';g.lineWidth=2;for(let i=0;i<=2;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,h);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(w,i*64);g.stroke();}});
const carpetTex=canvasTex(64,64,(g,w,h)=>{g.fillStyle='#9a9387';g.fillRect(0,0,w,h);for(let i=0;i<500;i++){g.fillStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},${Math.random()<.5?255:0},.04)`;g.fillRect(Math.random()*w,Math.random()*h,1,1);}});
const std=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,...o});
const M={wall:std(0xf3f0ea,{roughness:.92}),cap:std(0x7a7a7a),ceil:std(0xfbfaf7,{side:THREE.DoubleSide}),slab:std(0xbdb6aa),ground:std(0xdcd8cf),
  frame:std(0xfafafa,{roughness:.5}),glass:new THREE.MeshPhysicalMaterial({color:0xbfdcea,roughness:.05,transparent:true,opacity:.28,depthWrite:false}),
  door:std(0xa77a4f,{roughness:.6}),white:std(0xf7f7f5,{roughness:.35}),porcelain:std(0xffffff,{roughness:.2}),counter:std(0x3f3f42,{roughness:.4}),cabinet:std(0xe9e4da,{roughness:.7}),
  steel:std(0xb8bcc0,{metalness:.6,roughness:.3}),dark:std(0x2a2a2c,{roughness:.5}),fabric:std(0x8d9aa3,{roughness:.95}),fabric2:std(0x7a8790,{roughness:.95}),linen:std(0xf2efe8,{roughness:.95}),
  blanket:std(0x6f8f8a,{roughness:.95}),pillow:std(0xffffff,{roughness:.9}),wood:std(0x8a6a4a,{roughness:.7}),table:std(0x9b7653,{roughness:.55}),chair:std(0x5d4a3a,{roughness:.6}),
  pot:std(0xb5703f),leaf:std(0x3f8f3a,{side:THREE.DoubleSide}),screen:std(0x111214,{roughness:.2,metalness:.3}),rug:std(0xb9a58a,{roughness:1}),
  floor:{wood:std(0xffffff,{map:woodTex,roughness:.75}),tile:std(0xffffff,{map:tileTex,roughness:.6}),carpet:std(0xffffff,{map:carpetTex,roughness:1}),concrete:std(0xc4c1ba,{roughness:.95})}};
const FLOOR_REP={wood:150,tile:60,carpet:60,concrete:100};

// ---------------------------------------------------------------- mesh helpers
const groups={};
function grp(name){if(groups[name]){clearLabels(groups[name]);scene.remove(groups[name]);}const g=new THREE.Group();g.name=name;scene.add(g);groups[name]=g;return g;}
function box(par,x0,x1,y0,y1,z0,z1,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0)),mat);m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);par.add(m);return m;}
function rbox(par,cx,cz,w,d,y0,y1,yaw,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,y1-y0,d),mat);m.position.set(cx,(y0+y1)/2,cz);m.rotation.y=yaw;par.add(m);return m;}
function shapeOf(poly){return new THREE.Shape(poly.map(([x,z])=>new THREE.Vector2(x,-z)));}
function prism(par,poly,y0,y1,mat){const g=new THREE.ExtrudeGeometry(shapeOf(poly),{depth:y1-y0,bevelEnabled:false});g.rotateX(-Math.PI/2);g.translate(0,y0,0);const m=new THREE.Mesh(g,mat);par.add(m);return m;}
function cyl(par,x,z,r,y0,y1,mat,seg=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,y1-y0,seg),mat);m.position.set(x,(y0+y1)/2,z);par.add(m);return m;}
function ell(par,x,z,rx,rz,y0,y1,mat){const m=cyl(par,x,z,1,y0,y1,mat,32);m.scale.set(rx,1,rz);return m;}

const H={ceil:R.heights.ceiling,door:R.heights.door_head,sill:R.heights.window_sill,head:R.heights.window_head};
const HSRC=R.heights.source||{};
const wallMeshes=[],snapPts=[],colliders=[];

// wall piece along wall w: along p0..p1, offset o0..o1, height y0..y1
function piece(par,w,p0,p1,o0,o1,y0,y1,mat,record){
  if(p1-p0<.01||y1-y0<.01) return null;
  const c=at(w,(p0+p1)/2,(o0+o1)/2);
  const m=rbox(par,c[0],c[1],p1-p0,o1-o0,y0,y1,w.yaw,mat);
  if(record){wallMeshes.push(m);
    for(const p of [p0,p1])for(const o of [o0,o1]){const q=at(w,p,o);for(const y of [y0,y1])snapPts.push(new THREE.Vector3(q[0],y,q[1]));}
    if(y0<120) colliders.push({a:at(w,p0,0),b:at(w,p1,0),r:(o1-o0)/2});}
  return m;
}
// ---------------------------------------------------------------- shell
function buildShell(){
  wallMeshes.length=0;snapPts.length=0;colliders.length=0;
  const gW=grp('walls'),gWin=grp('windows'),gDoor=grp('doors'),gF=grp('floors'),gC=grp('ceiling');
  const mats=[M.wall,M.wall,M.cap,M.wall,M.wall,M.wall];
  for(const w of R.walls){
    const h=w.t/2, ops=R.openings.filter(o=>o.wall===w.id).sort((a,b)=>a.from-b.from);
    let cur=-h;
    for(const o of ops){
      piece(gW,w,cur,o.from,-h,h,0,H.ceil,mats,true);
      const sill=o.sill??H.sill, head=o.head??H.head;
      if(o.kind==='window'){piece(gW,w,o.from,o.to,-h,h,0,sill,mats,true);piece(gW,w,o.from,o.to,-h,h,head,H.ceil,mats,true);buildWindow(gWin,w,o,sill,head);}
      else {const top=o.head??H.door; piece(gW,w,o.from,o.to,-h,h,top,H.ceil,mats,true); if(o.kind!=='opening') buildDoor(gDoor,w,o,top);}
      cur=o.to;
    }
    piece(gW,w,cur,w.len+h,-h,h,0,H.ceil,mats,true);
    piece(gW,w,-h,w.len+h,-h,h,-20,0,M.slab,false);
  }
  for(const r of R.rooms){
    const g=new THREE.ShapeGeometry(shapeOf(r.poly)); g.rotateX(-Math.PI/2);
    const rep=FLOOR_REP[r.floor]||150, uv=g.attributes.uv, pos=g.attributes.position;
    for(let i=0;i<uv.count;i++) uv.setXY(i,pos.getX(i)/rep,pos.getZ(i)/rep);
    const m=new THREE.Mesh(g,M.floor[r.floor]||M.floor.wood); gF.add(m); wallMeshes.push(m);
    prism(gF,r.poly,-20,-.3,M.slab);
    const c=prism(gC,r.poly,H.ceil,H.ceil+2,M.ceil); wallMeshes.push(c);
  }
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(span*8,span*8).rotateX(-Math.PI/2),M.ground); ground.position.set(BB.cx,-20.5,BB.cy); gF.add(ground);
  gC.visible=document.getElementById('tCeil').checked&&mode!=='top';
  gDoor.visible=document.getElementById('tDoors').checked;
}
function buildWindow(g,w,o,sill,head){
  const f=5,d=7,mid=(o.from+o.to)/2;
  for(const [p0,p1,y0,y1] of [[o.from,o.from+f,sill,head],[o.to-f,o.to,sill,head],[o.from,o.to,sill,sill+f],[o.from,o.to,head-f,head],[mid-2.5,mid+2.5,sill,head]]) piece(g,w,p0,p1,-d/2,d/2,y0,y1,M.frame,false);
  piece(g,w,o.from+f,o.to-f,-.6,.6,sill+f,head-f,M.glass,false);
}
function buildDoor(g,w,o,top){
  const h=w.t/2,wd=o.to-o.from,s=o.side,tk=4;
  const leaves=o.kind==='double_door'?[{hp:o.from,dir:1,r:wd/2},{hp:o.to,dir:-1,r:wd/2}]:[{hp:o.hinge==='a'?o.from:o.to,dir:o.hinge==='a'?1:-1,r:wd}];

  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,p]),new THREE.LineBasicMaterial({color:0xd0021b,depthTest:false,transparent:true}));ln.renderOrder=10;g.add(ln);
  const dist=a.distanceTo(p),dh=Math.hypot(p.x-a.x,p.z-a.z),dy=Math.abs(p.y-a.y);
  const el=document.createElement('div');el.className='mlab';el.textContent=dist.toFixed(1)+' '+T.cm;const lab=new CSS2DObject(el);lab.position.copy(a).add(p).multiplyScalar(.5);g.add(lab);
  measures.push({g,dist,dh,dy});renderList();}
function cancelPending(){if(pending){gM.remove(pending.g);pending=null;}}
function renderList(){document.getElementById('mlist').innerHTML=measures.map((m,i)=>`<li>${i+1}. <b dir="ltr">${m.dist.toFixed(1)}</b> ${T.cm} <span class="note">(${T.horiz} ${m.dh.toFixed(1)} · ${T.vert} ${m.dy.toFixed(1)})</span></li>`).join('');}

// ---------------------------------------------------------------- toggles + heights
const $=id=>document.getElementById(id);
$('tCeil').onchange=()=>{groups.ceiling.visible=$('tCeil').checked&&mode!=='top';};
$('tDims').onchange=placeDims;$('tRooms').onchange=()=>groups.rooms.visible=$('tRooms').checked;
$('tFurn').onchange=()=>groups.furniture.visible=$('tFurn').checked;$('tDoors').onchange=()=>groups.doors.visible=$('tDoors').checked;
const HK=[['hCeil','ceil','ceiling'],['hDoor','door','door_head'],['hSill','sill','window_sill'],['hHead','head','window_head']];
let anyDef=false;for(const [id,k,src] of HK){$(id).value=H[k];if(HSRC[src]==='default'){$(id).classList.add('def');$(id).style.color='#e07000';anyDef=true;}}
$('hNote').textContent=anyDef?T.hNoteDef:T.hNoteOk;
for(const [id] of HK)$(id).addEventListener('change',()=>{const v={};for(const [i,k] of HK)v[k]=+$(i).value;
  const ok=v.ceil>0&&v.door>0&&v.door<v.ceil&&v.sill>=0&&v.head>v.sill&&v.head<=v.ceil;
  for(const [i] of HK)$(i).style.borderColor=ok?'':'#d0021b';if(!ok)return;Object.assign(H,v);buildShell();placeDims();});

// ---------------------------------------------------------------- label occlusion (CSS2D ignores parent visibility and depth)
const occRay=new THREE.Raycaster();let frame=0;
function occlude(){const all=[];for(const n of ['dims','rooms'])groups[n]?.traverse(o=>{if(o.isCSS2DObject)all.push(o);});
  for(const m of measures)m.g.traverse(o=>{if(o.isCSS2DObject)all.push(o);});
  const cam=camera.position,occ=wallMeshes.filter(visibleChain);
  for(const o of all){if(!visibleChain(o)){o.element.style.opacity='0';continue;}if(mode==='top'){o.element.style.opacity='';continue;}
    const wp=o.getWorldPosition(new THREE.Vector3()),dir=wp.clone().sub(cam),len=dir.length();dir.normalize();occRay.set(cam,dir);occRay.far=Math.max(0,len-3);
    o.element.style.opacity=occRay.intersectObjects(occ,false).length?'0':'';}}

buildShell();buildItems();buildDims();buildRooms();setMode('orbit');
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(mode==='walk')stepWalk(dt);else if(mode==='orbit')orbit.update();else topCtl.update();
  if((frame++%4)===0)occlude();renderer.render(scene,camera);labelR.render(scene,camera);});
// test hooks (used by fp.py shoot / regression tests)
window.__fp={setMode,measures,addPoint:(x,y,z)=>addPoint(new THREE.Vector3(x,y,z)),setSnap:v=>{$('tSnap').checked=v;},startMeasure:()=>$('bMeasure').click()};
</script>
</body>
